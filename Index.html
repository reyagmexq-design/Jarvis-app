<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Mobile</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #00f3ff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            font-size: 24px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: rgba(16, 24, 38, 0.8);
            border: 2px solid #00f3ff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        }
        button {
            background-color: #00f3ff;
            color: #0b0f19;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }
        button:active {
            background-color: #00c2cc;
        }
        input {
            width: 90%;
            padding: 10px;
            background: #0b0f19;
            border: 1px solid #00f3ff;
            color: #fff;
            border-radius: 5px;
            margin-bottom: 10px;
            text-align: center;
        }
        .log {
            margin-top: 15px;
            font-size: 14px;
            color: #a5f3fc;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
            border-top: 1px dashed #00f3ff;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>J.A.R.V.I.S. OS</h1>
        <p>Sistemas en línea, Señor.</p>
        
        <button onclick="saludarJarvis()">Iniciar Sistemas de Voz</button>

        <hr style="border-color: #00f3ff; opacity: 0.3;">

        <h3>Registrar Pendiente</h3>
        <input type="text" id="inputNota" placeholder="Escribe un recordatorio...">
        <button onclick="guardarNota()">Guardar en Memoria</button>

        <div class="log" id="consolaLog">
            > Sistema listo para recibir comandos...
        </div>
    </div>

    <script>
        // Función de Voz (Text-to-Speech nativo del celular)
        function hablar(texto) {
            const mensaje = new SpeechSynthesisUtterance(texto);
            mensaje.lang = 'es-ES';
            mensaje.rate = 1.0;
            window.speechSynthesis.speak(mensaje);
            
            let log = document.getElementById('consolaLog');
            log.innerHTML += `<br>> JARVIS: ${texto}`;
        }

        function saludarJarvis() {
            hablar("Sistemas operativos al cien por ciento. ¿Qué se le ofrece, Señor?");
        }

        function guardarNota() {
            let texto = document.getElementById('inputNota').value;
            if(texto.trim() === "") return;

            // Guardar en la memoria interna del navegador del celular (LocalStorage)
            let notas = JSON.parse(localStorage.getItem('jarvis_notas') || '[]');
            notas.push(texto);
            localStorage.setItem('jarvis_notas', JSON.stringify(notas));

            hablar("Pendiente registrado con éxito en los servidores locales.");
            document.getElementById('inputNota').value = "";
            actualizarConsola();
        }

        function actualizarConsola() {
            let notas = JSON.parse(localStorage.getItem('jarvis_notas') || '[]');
            let log = document.getElementById('consolaLog');
            if(notas.length > 0) {
                log.innerHTML = `> <strong>Últimos registros:</strong><br>` + notas.map(n => `- ${n}`).join('<br>');
            }
        }

        // Cargar notas al iniciar
        window.onload = actualizarConsola;
    </script>

</body>
</html>
