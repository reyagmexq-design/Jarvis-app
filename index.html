<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Mobile</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #00f3ff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            font-size: 24px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: rgba(16, 24, 38, 0.8);
            border: 2px solid #00f3ff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        }
        button {
            background-color: #00f3ff;
            color: #0b0f19;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }
        button:active {
            background-color: #00c2cc;
        }
        .mic-btn {
            background-color: #ff0055;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
        }
        input {
            width: 90%;
            padding: 10px;
            background: #0b0f19;
            border: 1px solid #00f3ff;
            color: #fff;
            border-radius: 5px;
            margin-bottom: 10px;
            text-align: center;
        }
        .log {
            margin-top: 15px;
            font-size: 14px;
            color: #a5f3fc;
            text-align: left;
            max-height: 180px;
            overflow-y: auto;
            border-top: 1px dashed #00f3ff;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>J.A.R.V.I.S. OS</h1>
        <p>Sistemas de voz en línea, Señor.</p>
        
        <!-- Botón para escuchar por micrófono -->
        <button class="mic-btn" onclick="iniciarEscucha()">🎙️ Hablar con JARVIS</button>

        <button onclick="saludarJarvis()">Iniciar Sistemas</button>

        <hr style="border-color: #00f3ff; opacity: 0.3;">

        <h3>Registrar Pendiente</h3>
        <input type="text" id="inputNota" placeholder="Escribe un recordatorio...">
        <button onclick="guardarNota()">Guardar en Memoria</button>

        <div class="log" id="consolaLog">
            > Sistema listo. Presione el botón de micrófono para hablar...
        </div>
    </div>

    <script>
        // Sintetizador de Voz (JARVIS habla)
        function hablar(texto) {
            const mensaje = new SpeechSynthesisUtterance(texto);
            mensaje.lang = 'es-ES';
            mensaje.rate = 1.0;
            window.speechSynthesis.speak(mensaje);
            
            let log = document.getElementById('consolaLog');
            log.innerHTML += `<br>> <strong>JARVIS:</strong> ${texto}`;
        }

        function saludarJarvis() {
            hablar("Sistemas operativos al cien por ciento. ¿Qué se le ofrece, Señor?");
        }

        // Reconocimiento de Voz (JARVIS escucha al usuario)
        function iniciarEscucha() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                hablar("Lo siento, Señor. Su navegador no soporta el reconocimiento de voz nativo.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            let log = document.getElementById('consolaLog');
            log.innerHTML += `<br>> <em>Escuchando comandos...</em>`;
            hablar("Escuchando, Señor.");

            recognition.start();

            recognition.onresult = function(event) {
                const comandoTexto = event.results[0][0].transcript.toLowerCase();
                log.innerHTML += `<br>> <strong>Tú:</strong> ${comandoTexto}`;
                
                procesarComando(comandoTexto);
            };

            recognition.onerror = function(event) {
                hablar("No he podido capturar el audio con claridad.");
            };
        }

        // Lógica de Comandos por Voz Inteligentes
        function procesarComando(comando) {
            if (comando.includes("hora")) {
                const horaActual = new Date().toLocaleTimeString();
                hablar(`La hora actual del sistema es ${horaActual}.`);
            } 
            else if (comando.includes("estado") || comando.includes("sistema")) {
                hablar("Todos los núcleos operando de manera óptima, Señor.");
            } 
            else if (comando.includes("gracias")) {
                hablar("A su servicio, como siempre, Señor.");
            } 
            else {
                hablar(`Comando recibido: ${comando}. Procesando información.`);
            }
        }

        function guardarNota() {
            let texto = document.getElementById('inputNota').value;
            if(texto.trim() === "") return;

            let notas = JSON.parse(localStorage.getItem('jarvis_notas') || '[]');
            notas.push(texto);
            localStorage.setItem('jarvis_notas', JSON.stringify(notas));

            hablar("Pendiente registrado con éxito.");
            document.getElementById('inputNota').value = "";
        }
    </script>

</body>
  </html>
